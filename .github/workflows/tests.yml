name: tests

on:
  push:
  pull_request:

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests demo
          ruff format --check src tests demo
      - name: Test
        run: pytest -v
