# Dependabot version updates: one grouped PR per ecosystem per month.
# Security fixes are separate: they are opened as soon as a vulnerability is published.
version: 2
updates:
  # requirements.txt, requirements-api.txt and pyproject.toml
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # The published model was trained and tested with TensorFlow 2.20 / Keras 3.
      # Major upgrades can break loading .keras files, so they are done by hand.
      - dependency-name: tensorflow
        update-types: ["version-update:semver-major"]
      - dependency-name: keras
        update-types: ["version-update:semver-major"]

  # Hugging Face Space dependencies
  - package-ecosystem: pip
    directory: /demo
    schedule:
      interval: monthly
    groups:
      demo-dependencies:
        patterns: ["*"]
    ignore:
      # Gradio 6 removes APIs the demo uses; upgrade deliberately.
      - dependency-name: gradio
        update-types: ["version-update:semver-major"]

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  # Base image in the Dockerfile (python:3.11-slim gets regular security patches)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Stay on Python 3.11, which the project is tested on.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
